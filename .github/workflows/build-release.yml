name: Build and release IPK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update
        required: true
        default: v1.0.5-2
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PACKAGE_NAME: luci-app-xlnetacc
  SDK_URL: https://downloads.openwrt.org/releases/23.05.5/targets/x86/64/openwrt-sdk-23.05.5-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
  SDK_SHA256: 9e5b6813a3f810123391f5f3ea10dfd1c14be1a880f410c70ec4424bbd1573d2

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison gawk gettext libncurses-dev \
            libssl-dev python3 rsync unzip wget zlib1g-dev

      - name: Download and verify OpenWrt SDK
        run: |
          wget -O /tmp/openwrt-sdk.tar.xz "$SDK_URL"
          echo "$SDK_SHA256  /tmp/openwrt-sdk.tar.xz" | sha256sum -c -
          mkdir -p /tmp/openwrt-sdk
          tar -xf /tmp/openwrt-sdk.tar.xz -C /tmp/openwrt-sdk --strip-components=1
          echo "SDK_DIR=/tmp/openwrt-sdk" >> "$GITHUB_ENV"

      - name: Prepare feeds
        run: |
          cd "$SDK_DIR"
          ./scripts/feeds update -a
          ./scripts/feeds install luci-base

      - name: Add package source
        run: |
          package_dir="$SDK_DIR/package/$PACKAGE_NAME"
          mkdir -p "$package_dir"
          rsync -a --delete \
            --exclude .git \
            --exclude .github \
            --exclude .DS_Store \
            "$GITHUB_WORKSPACE/" "$package_dir/"
          echo "CONFIG_PACKAGE_${PACKAGE_NAME}=m" > "$SDK_DIR/.config"
          make -C "$SDK_DIR" defconfig

      - name: Build package
        run: |
          make -C "$SDK_DIR" package/feeds/luci/luci-base/compile -j"$(nproc)" V=s || \
            make -C "$SDK_DIR" package/feeds/luci/luci-base/compile -j1 V=s
          make -C "$SDK_DIR" "package/$PACKAGE_NAME/compile" -j"$(nproc)" V=s || \
            make -C "$SDK_DIR" "package/$PACKAGE_NAME/compile" -j1 V=s

      - name: Collect IPK
        id: package
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          mapfile -t packages < <(find "$SDK_DIR/bin/packages" -type f -name "${PACKAGE_NAME}_*.ipk")
          if [ "${#packages[@]}" -ne 1 ]; then
            printf 'Expected one IPK, found %s\n' "${#packages[@]}"
            printf '%s\n' "${packages[@]}"
            exit 1
          fi
          cp "${packages[0]}" "$GITHUB_WORKSPACE/dist/"
          package_file=$(basename "${packages[0]}")
          echo "file=$package_file" >> "$GITHUB_OUTPUT"
          sha256sum "$GITHUB_WORKSPACE/dist/$package_file" \
            | tee "$GITHUB_WORKSPACE/dist/$package_file.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-xlnetacc-ipk
          path: dist/*

      - name: Determine release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            release_tag="$INPUT_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          PACKAGE_FILE: ${{ steps.package.outputs.file }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "dist/$PACKAGE_FILE" "dist/$PACKAGE_FILE.sha256" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "dist/$PACKAGE_FILE" "dist/$PACKAGE_FILE.sha256" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "LuCI captcha login and loginKey credential reuse support."
          fi
